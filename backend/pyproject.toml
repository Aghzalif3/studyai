[project]
name = "studyai"
version = "0.1.0"
description = "StudyAI : transforme tes vidéos de cours en supports de révision (Whisper local + Claude)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "fpdf2>=2.7",
  "pytesseract>=0.3.10",
  # Transcription locale : mlx-whisper (modèles OpenAI Whisper accélérés par la puce Apple)
  # sur Mac Apple Silicon ; faster-whisper ailleurs (Mac Intel, Linux).
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
  # OCR Apple Vision (gratuit, intégré à macOS, excellent en français)
  "ocrmac>=1.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Paquet officiel openai-whisper (PyTorch, ~2 Go). Optionnel : plus lent sur Mac.
openai = ["openai-whisper>=20240930"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
